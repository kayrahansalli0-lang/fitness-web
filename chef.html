<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dolap Şefi</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #161616;
      --border-color: #262626;
      --primary-orange: #ff6b00;
      --accent-orange: #ff8800;
      --text-main: #f5f5f5;
      --text-muted: #8a8a8a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 18px;
      padding-bottom: 40px;
    }

    .chef-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .chef-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #1f140e;
      border: 1px solid var(--primary-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--primary-orange);
      box-shadow: 0 0 12px rgba(255, 107, 0, 0.25);
    }

    .chef-header-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .chef-header-text h1 span {
      color: var(--primary-orange);
    }

    .chef-header-text p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .input-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .camera-container {
      position: relative;
      width: 100%;
      height: 240px;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video, img#snapshotPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #snapshotPreview {
      display: none;
    }

    .camera-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }

    .camera-placeholder i {
      font-size: 2.2rem;
      color: var(--primary-orange);
    }

    .camera-placeholder p {
      font-size: 0.85rem;
      font-weight: 700;
      color: #fff;
    }

    .cam-actions {
      display: flex;
      gap: 10px;
    }

    .cam-btn {
      flex: 1;
      padding: 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.82rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      border: 1px solid var(--border-color);
      background: #181818;
      color: #fff;
      transition: all 0.2s ease;
    }

    .cam-btn.primary {
      background: #25160e;
      border-color: var(--primary-orange);
      color: var(--primary-orange);
    }

    .cam-btn:active {
      transform: scale(0.97);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    textarea {
      width: 100%;
      height: 65px;
      background-color: #101010;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      color: var(--text-main);
      font-size: 0.88rem;
      resize: none;
      outline: none;
    }

    textarea:focus {
      border-color: var(--primary-orange);
    }

    .target-protein-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #101010;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .target-protein-row span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    input[type="number"] {
      width: 65px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      color: var(--primary-orange);
      font-weight: 800;
      font-size: 1rem;
      padding: 6px 8px;
      border-radius: 8px;
      text-align: center;
      outline: none;
    }

    .btn-submit {
      background: var(--primary-orange);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s ease;
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .recipe-card {
      display: none;
      background: linear-gradient(135deg, #18120e, #141414);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary-orange);
      border-radius: 14px;
      padding: 18px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .recipe-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
    }

    .recipe-time {
      font-size: 0.78rem;
      color: var(--primary-orange);
      margin-top: 4px;
      font-weight: 700;
    }

    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 0;
    }

    .macro-box {
      background: #111;
      border: 1px solid var(--border-color);
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
    }

    .macro-box .val {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .macro-box.protein .val {
      color: var(--primary-orange);
    }

    .macro-box .lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    .section-title {
      font-size: 0.8rem;
      color: var(--primary-orange);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 800;
      margin-top: 14px;
      margin-bottom: 8px;
    }

    .ingredients-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ingredients-list li {
      background: #111;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #ddd;
    }

    .instructions-list {
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .instructions-list li {
      font-size: 0.83rem;
      color: #ccc;
      line-height: 1.4;
    }

    canvas {
      display: none;
    }
  </style>
</head>
<body>

  <div class="chef-header">
    <div class="chef-icon-box">
      <i class="fa-solid fa-kitchen-set"></i>
    </div>
    <div class="chef-header-text">
      <h1>Dolap <span>Şefi</span> 🍳</h1>
      <p>Kamerayı dolaba tut, yüksek proteinli tarif çıksın</p>
    </div>
  </div>

  <div class="input-card">
    <div class="camera-container" id="camContainer">
      <div class="camera-placeholder" id="camPlaceholder" onclick="startCamera()">
        <i class="fa-solid fa-camera"></i>
        <p>Kamerayı Başlat</p>
        <span style="font-size: 0.72rem;">Dolabını veya tezgahı tara</span>
      </div>
      <video id="videoFeed" autoplay playsinline style="display: none;"></video>
      <img id="snapshotPreview" alt="Çekilen Kare">
    </div>

    <div class="cam-actions">
      <button class="cam-btn primary" id="btnSnap" style="display: none;" onclick="takeSnapshot()">
        <i class="fa-solid fa-circle-dot"></i> Fotoğrafı Çek ve Hesapla
      </button>
      <button class="cam-btn" id="btnRetake" style="display: none;" onclick="retakePhoto()">
        <i class="fa-solid fa-rotate-left"></i> Yeniden Çek
      </button>
    </div>

    <div class="form-group">
      <label><i class="fa-solid fa-pen"></i> Ek Malzemeler (İsteğe Bağlı)</label>
      <textarea id="chefIngredients" placeholder="Görünmeyen tuz, baharat, sos veya elindeki diğer malzemeleri ekle..."></textarea>
    </div>

    <div class="target-protein-row">
      <span>Hedef Protein:</span>
      <div style="display: flex; align-items: center; gap: 6px;">
        <input type="number" id="chefTargetProtein" value="35" min="10" max="100">
        <span style="font-size: 0.8rem; color: var(--text-muted);">gram</span>
      </div>
    </div>

    <button class="btn-submit" id="btnGenerateRecipe">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>Fit Tarif Oluştur</span>
    </button>
  </div>

  <div id="recipeResult" class="recipe-card">
    <div class="recipe-title" id="recipeTitle"></div>
    <div class="recipe-time">
      <i class="fa-solid fa-clock"></i> <span id="recipeTime"></span>
    </div>

    <div class="macro-grid">
      <div class="macro-box">
        <div class="val" id="macroCal">-</div>
        <div class="lbl">Kalori</div>
      </div>
      <div class="macro-box protein">
        <div class="val" id="macroProtein">-</div>
        <div class="lbl">Protein</div>
      </div>
      <div class="macro-box">
        <div class="val" id="macroCarb">-</div>
        <div class="lbl">Karb</div>
      </div>
      <div class="macro-box">
        <div class="val" id="macroFat">-</div>
        <div class="lbl">Yağ</div>
      </div>
    </div>

    <div class="section-title">
      <i class="fa-solid fa-list-check"></i> Kullanılan Malzemeler
    </div>
    <ul class="ingredients-list" id="recipeIngredients"></ul>

    <div class="section-title">
      <i class="fa-solid fa-fire-burner"></i> Hazırlanışı
    </div>
    <ol class="instructions-list" id="recipeSteps"></ol>
  </div>

  <canvas id="snapshotCanvas"></canvas>

  <script>
    let stream = null;
    let currentBase64Image = null;

    const video = document.getElementById('videoFeed');
    const preview = document.getElementById('snapshotPreview');
    const placeholder = document.getElementById('camPlaceholder');
    const btnSnap = document.getElementById('btnSnap');
    const btnRetake = document.getElementById('btnRetake');
    const canvas = document.getElementById('snapshotCanvas');
    const btnSubmit = document.getElementById('btnGenerateRecipe');
    const resultCard = document.getElementById('recipeResult');

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 }, height: { ideal: 720 } },
          audio: false
        });
        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        btnSnap.style.display = 'flex';
      } catch (err) {
        alert('Kamera açılamadı! İzinleri kontrol edin: ' + err.message);
      }
    }

    function takeSnapshot() {
      const maxDim = 800;
      let w = video.videoWidth || 640;
      let h = video.videoHeight || 480;

      if (w > maxDim || h > maxDim) {
        if (w > h) {
          h = Math.round((h * maxDim) / w);
          w = maxDim;
        } else {
          w = Math.round((w * maxDim) / h);
          h = maxDim;
        }
      }

      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, w, h);

      const fullDataUrl = canvas.toDataURL('image/jpeg', 0.6);
      preview.src = fullDataUrl;
      currentBase64Image = fullDataUrl.split(',')[1];

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
      video.style.display = 'none';
      preview.style.display = 'block';
      btnSnap.style.display = 'none';
      btnRetake.style.display = 'flex';

      runRecipeGeneration();
    }

    function retakePhoto() {
      currentBase64Image = null;
      preview.style.display = 'none';
      btnRetake.style.display = 'none';
      startCamera();
    }

    async function runRecipeGeneration() {
      const ingredientsText = document.getElementById('chefIngredients').value.trim();
      const targetProtein = document.getElementById('chefTargetProtein').value || 35;

      if (!ingredientsText && !currentBase64Image) {
        alert('Lütfen kameradan bir kare çekin veya malzeme adı yazın.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Görsel Analiz Ediliyor...</span>';
      btnRetake.disabled = true;

      try {
        // Doğrudan localhost:5000 Express sunucusuna hedefliyoruz
        const targetUrl = `${window.location.protocol}//${window.location.hostname}:5000/api/fridge-chef`;

        const res = await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            ingredientsText,
            imageBase64: currentBase64Image,
            targetProtein
          })
        });

        const resText = await res.text();
        let data;
        try {
          data = JSON.parse(resText);
        } catch (parseErr) {
          console.error("Gelen Ham Cevap:", resText);
          throw new Error(`Sunucu yanıtı JSON değil (${res.status}): ${resText.slice(0, 120)}`);
        }

        if (!res.ok || data.error) {
          throw new Error(data.error || `Sunucu Hatası (${res.status})`);
        }

        document.getElementById('recipeTitle').textContent = data.recipeName || 'Fit Tarif';
        document.getElementById('recipeTime').textContent = `Hazırlık: ${data.prepTime || '15 dk'}`;

        const macros = data.macros || {};
        document.getElementById('macroCal').textContent = macros.calories || macros.kalori || '-';
        document.getElementById('macroProtein').textContent = (macros.protein ? `${macros.protein}g` : '-');
        document.getElementById('macroCarb').textContent = (macros.carbs || macros.karbonhidrat ? `${macros.carbs || macros.karbonhidrat}g` : '-');
        document.getElementById('macroFat').textContent = (macros.fat || macros.yag ? `${macros.fat || macros.yag}g` : '-');

        const ingList = document.getElementById('recipeIngredients');
        ingList.innerHTML = (data.usedIngredients || []).map(item => `<li>${item}</li>`).join('');

        const stepList = document.getElementById('recipeSteps');
        stepList.innerHTML = (data.instructions || []).map(step => `<li>${step}</li>`).join('');

        resultCard.style.display = 'block';
        resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        alert('İşlem Hatası: ' + err.message);
      } finally {
        btnSubmit.disabled = false;
        btnSubmit.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> <span>Fit Tarif Oluştur</span>';
        btnRetake.disabled = false;
      }
    }

    btnSubmit.addEventListener('click', runRecipeGeneration);
  </script>
</body>
</html>
