<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Dolap Şefi</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #161616;
      --border-color: #262626;
      --primary-orange: #ff6b00;
      --accent-orange: #ff8800;
      --text-main: #f5f5f5;
      --text-muted: #8a8a8a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      padding: 18px;
      padding-bottom: 40px;
    }

    /* Başlık */
    .chef-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
    }

    .chef-icon-box {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      background: #1f140e;
      border: 1px solid var(--primary-orange);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: var(--primary-orange);
      box-shadow: 0 0 12px rgba(255, 107, 0, 0.25);
    }

    .chef-header-text h1 {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .chef-header-text h1 span {
      color: var(--primary-orange);
    }

    .chef-header-text p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Form Kartı */
    .input-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 20px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 0.75rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .form-group label i {
      color: var(--primary-orange);
    }

    textarea {
      width: 100%;
      height: 90px;
      background-color: #101010;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px;
      color: var(--text-main);
      font-size: 0.9rem;
      resize: none;
      outline: none;
      transition: border-color 0.2s ease;
    }

    textarea:focus {
      border-color: var(--primary-orange);
    }

    .target-protein-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #101010;
      padding: 10px 14px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }

    .target-protein-row span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .number-input-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    input[type="number"] {
      width: 65px;
      background: #1a1a1a;
      border: 1px solid var(--border-color);
      color: var(--primary-orange);
      font-weight: 800;
      font-size: 1rem;
      padding: 6px 8px;
      border-radius: 8px;
      text-align: center;
      outline: none;
    }

    input[type="number"]:focus {
      border-color: var(--primary-orange);
    }

    .btn-submit {
      background: var(--primary-orange);
      color: #000;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* Tarif Sonuç Kartı */
    .recipe-card {
      display: none;
      background: linear-gradient(135deg, #18120e, #141414);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary-orange);
      border-radius: 14px;
      padding: 18px;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .recipe-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #fff;
      line-height: 1.3;
    }

    .recipe-time {
      font-size: 0.78rem;
      color: var(--primary-orange);
      margin-top: 4px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Makro Rozetleri */
    .macro-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 0;
    }

    .macro-box {
      background: #111;
      border: 1px solid var(--border-color);
      padding: 8px 4px;
      border-radius: 8px;
      text-align: center;
    }

    .macro-box .val {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .macro-box.protein .val {
      color: var(--primary-orange);
    }

    .macro-box .lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      margin-top: 2px;
    }

    /* Malzeme ve Adım Listeleri */
    .section-title {
      font-size: 0.8rem;
      color: var(--primary-orange);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 800;
      margin-top: 14px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ingredients-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ingredients-list li {
      background: #111;
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      color: #ddd;
    }

    .instructions-list {
      padding-left: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .instructions-list li {
      font-size: 0.83rem;
      color: #ccc;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <!-- Başlık -->
  <div class="chef-header">
    <div class="chef-icon-box">
      <i class="fa-solid fa-kitchen-set"></i>
    </div>
    <div class="chef-header-text">
      <h1>Dolap <span>Şefi</span> 🍳</h1>
      <p>Elindeki malzemelerle yüksek proteinli tarif</p>
    </div>
  </div>

  <!-- Giriş Formu -->
  <div class="input-card">
    <div class="form-group">
      <label><i class="fa-solid fa-basket-shopping"></i> Dolaptaki Malzemeler</label>
      <textarea id="chefIngredients" placeholder="Örn: 3 yumurta, 100g lor peyniri, yulaf, zeytinyağı, pul biber..."></textarea>
    </div>

    <div class="target-protein-row">
      <span>Hedef Protein:</span>
      <div class="number-input-wrapper">
        <input type="number" id="chefTargetProtein" value="35" min="10" max="100">
        <span style="font-size: 0.8rem; color: var(--text-muted);">gram</span>
      </div>
    </div>

    <button class="btn-submit" id="btnGenerateRecipe">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>Fit Tarif Oluştur</span>
    </button>
  </div>

  <!-- Sonuç Kartı -->
  <div id="recipeResult" class="recipe-card">
    <div class="recipe-title" id="recipeTitle"></div>
    <div class="recipe-time">
      <i class="fa-solid fa-clock"></i>
      <span id="recipeTime"></span>
    </div>

    <div class="macro-grid">
      <div class="macro-box">
        <div class="val" id="macroCal">-</div>
        <div class="lbl">Kalori</div>
      </div>
      <div class="macro-box protein">
        <div class="val" id="macroProtein">-</div>
        <div class="lbl">Protein</div>
      </div>
      <div class="macro-box">
        <div class="val" id="macroCarb">-</div>
        <div class="lbl">Karb</div>
      </div>
      <div class="macro-box">
        <div class="val" id="macroFat">-</div>
        <div class="lbl">Yağ</div>
      </div>
    </div>

    <div class="section-title">
      <i class="fa-solid fa-list-check"></i> Kullanılan Malzemeler
    </div>
    <ul class="ingredients-list" id="recipeIngredients"></ul>

    <div class="section-title">
      <i class="fa-solid fa-fire-burner"></i> Hazırlanışı
    </div>
    <ol class="instructions-list" id="recipeSteps"></ol>
  </div>

  <script>
    const btn = document.getElementById('btnGenerateRecipe');
    const resultCard = document.getElementById('recipeResult');

    btn.addEventListener('click', async () => {
      const ingredientsText = document.getElementById('chefIngredients').value.trim();
      const targetProtein = document.getElementById('chefTargetProtein').value || 35;

      if (!ingredientsText) {
        alert('Lütfen elindeki birkaç malzemeyi yaz.');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Şef Hazırlıyor...</span>';

      try {
        const res = await fetch('/api/fridge-chef', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ingredientsText, targetProtein })
        });

        const data = await res.json();
        if (data.error) throw new Error(data.error);

        // Başlık & Süre
        document.getElementById('recipeTitle').textContent = data.recipeName || 'Fit Tarif';
        document.getElementById('recipeTime').textContent = `Hazırlık: ${data.prepTime || '15 dk'}`;

        // Makrolar
        const macros = data.macros || {};
        document.getElementById('macroCal').textContent = macros.calories || macros.kalori || '-';
        document.getElementById('macroProtein').textContent = (macros.protein ? `${macros.protein}g` : '-');
        document.getElementById('macroCarb').textContent = (macros.carbs || macros.karbonhidrat ? `${macros.carbs || macros.karbonhidrat}g` : '-');
        document.getElementById('macroFat').textContent = (macros.fat || macros.yag ? `${macros.fat || macros.yag}g` : '-');

        // Malzemeler
        const ingList = document.getElementById('recipeIngredients');
        ingList.innerHTML = (data.usedIngredients || []).map(item => `<li>${item}</li>`).join('');

        // Hazırlanış
        const stepList = document.getElementById('recipeSteps');
        stepList.innerHTML = (data.instructions || []).map(step => `<li>${step}</li>`).join('');

        resultCard.style.display = 'block';
        resultCard.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } catch (err) {
        alert('Tarif oluşturulamadı: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-wand-magic-sparkles"></i> <span>Fit Tarif Oluştur</span>';
      }
    });
  </script>
</body>
</html>
