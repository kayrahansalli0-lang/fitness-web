<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canlı Aktivite & Kalori Takibi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --brand-orange: #fc6A03;
      --pure-black: #0a0a0a;
      --surface-black: #141414;
      --surface-card: #1c1c1c;
      --pure-white: #ffffff;
      --border-dark: #262626;
      --muted-gray: #888888;
      --green-active: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Üst Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-dark);
    }

    .top-bar h1 {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .status-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: #222;
      color: var(--muted-gray);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill.active {
      background: rgba(0, 230, 118, 0.15);
      color: var(--green-active);
      border: 1px solid var(--green-active);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    /* Ana Kalori Göstergesi */
    .main-burn {
      background: linear-gradient(145deg, #18120e, var(--surface-black));
      border: 1px solid var(--border-dark);
      border-top: 3px solid var(--brand-orange);
      border-radius: 20px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
    }

    .burn-title {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--muted-gray);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .burn-value {
      font-size: 3.5rem;
      font-weight: 900;
      color: var(--brand-orange);
      line-height: 1.1;
      margin: 8px 0;
      text-shadow: 0 0 20px rgba(252, 106, 3, 0.3);
    }

    .burn-unit {
      font-size: 1.1rem;
      color: #fff;
      font-weight: 700;
    }

    .speed-tag {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.8rem;
      color: #aaa;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 12px;
      border-radius: 12px;
    }

    /* 4'lü Metrik Izgarası */
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }

    .metric-card {
      background: var(--surface-black);
      border: 1px solid var(--border-dark);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .metric-icon {
      font-size: 1.2rem;
      color: var(--brand-orange);
      margin-bottom: 6px;
    }

    .metric-val {
      font-size: 1.4rem;
      font-weight: 800;
      color: #fff;
    }

    .metric-lbl {
      font-size: 0.7rem;
      font-weight: 600;
      color: var(--muted-gray);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Kilo & Hedef Ayarı */
    .settings-bar {
      background: var(--surface-card);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .weight-input {
      background: #111;
      border: 1px solid #333;
      color: var(--brand-orange);
      font-weight: 800;
      padding: 6px 10px;
      border-radius: 8px;
      width: 65px;
      text-align: center;
      outline: none;
    }

    /* Butonlar */
    .controls {
      display: flex;
      gap: 12px;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.15s ease;
      text-transform: uppercase;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-start {
      background: var(--brand-orange);
      color: #000;
    }

    .btn-stop {
      background: #d32f2f;
      color: #fff;
      display: none;
    }

    .btn-reset {
      background: #222;
      color: var(--muted-gray);
      flex: 0.4;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>CANLI YÜRÜYÜŞ & KALORİ</h1>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">Beklemede</span>
    </div>
  </div>

  <!-- Ana Kalori Ekranı -->
  <div class="main-burn">
    <div class="burn-title">Yakılan Aktif Kalori</div>
    <div class="burn-value" id="calDisplay">0.0</div>
    <div class="burn-unit">KCAL</div>
    <div class="speed-tag" id="activityState">Hareketsiz Duruyor</div>
  </div>

  <!-- Metrikler -->
  <div class="metrics-grid">
    <div class="metric-card">
      <i class="fa-solid fa-route metric-icon"></i>
      <div class="metric-val" id="distDisplay">0.00</div>
      <div class="metric-lbl">Mesafe (KM)</div>
    </div>
    <div class="metric-card">
      <i class="fa-solid fa-gauge-high metric-icon"></i>
      <div class="metric-val" id="speedDisplay">0.0</div>
      <div class="metric-lbl">Anlık Hız (KM/S)</div>
    </div>
    <div class="metric-card">
      <i class="fa-solid fa-stopwatch metric-icon"></i>
      <div class="metric-val" id="timeDisplay">00:00</div>
      <div class="metric-lbl">Hareket Süresi</div>
    </div>
    <div class="metric-card">
      <i class="fa-solid fa-shoe-prints metric-icon"></i>
      <div class="metric-val" id="stepDisplay">0</div>
      <div class="metric-lbl">Yaklaşık Adım</div>
    </div>
  </div>

  <!-- Kilo Ayarı -->
  <div class="settings-bar">
    <span>Hesaplama Kilonuz:</span>
    <div>
      <input type="number" id="weightInput" class="weight-input" value="75">
      <span style="color: var(--muted-gray); font-size: 0.8rem;">kg</span>
    </div>
  </div>

  <!-- Kontroller -->
  <div class="controls">
    <button class="btn btn-reset" onclick="resetTracking()"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="btn btn-start" id="btnStart" onclick="startTracking()"><i class="fa-solid fa-play"></i> Takibi Başlat</button>
    <button class="btn btn-stop" id="btnStop" onclick="stopTracking()"><i class="fa-solid fa-pause"></i> Durdur</button>
  </div>

  <script>
    let watchId = null;
    let timerInterval = null;
    let isTracking = false;

    let totalMeters = 0;
    let totalCalories = 0.0;
    let secondsElapsed = 0;
    let lastPosition = null;
    let currentSpeedKmh = 0;

    // Haversine Formülü: İki koordinat arası kesin metre
    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3; // Dünya yarıçapı (m)
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    // Hıza göre bilimsel MET katsayısı
    function getMetBySpeed(speedKmh) {
      if (speedKmh < 1.0) return 0;       // Duruyor, ekstra kalori yok
      if (speedKmh < 3.8) return 2.8;     // Yavaş yürüyüş
      if (speedKmh < 5.4) return 3.5;     // Normal tempo
      if (speedKmh < 6.8) return 5.0;     // Hızlı yürüyüş / tempolu
      if (speedKmh < 9.0) return 8.3;     // Hafif koşu (jogging)
      return 11.0;                        // Koşu
    }

    function startTracking() {
      if (!navigator.geolocation) {
        alert("Cihazınızda konum servisi desteklenmiyor.");
        return;
      }

      isTracking = true;
      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'flex';
      
      const pill = document.getElementById('statusPill');
      pill.classList.add('active');
      document.getElementById('statusText').innerText = "Canlı Takipte";

      // Süre sayacı ve 1 saniyelik baz kalori hesabı
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerDisplay();

        // Anlık hıza göre her saniye kalori yakımı
        const weight = parseFloat(document.getElementById('weightInput').value) || 75;
        const met = getMetBySpeed(currentSpeedKmh);

        if (met > 0) {
          // Formül: (MET * 3.5 * Kilo / 200) / 60 = saniyede yakılan kcal
          const calPerSecond = (met * 3.5 * weight) / (200 * 60);
          totalCalories += calPerSecond;
          document.getElementById('calDisplay').innerText = totalCalories.toFixed(1);
        }
      }, 1000);

      // Yüksek hassasiyetli GPS dinleyicisi
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = pos.coords.accuracy;

          // GPS sapması 25 metreden fazlaysa atla
          if (accuracy > 25) return;

          if (lastPosition) {
            const dMeters = getDistanceMeters(lastPosition.lat, lastPosition.lng, lat, lng);
            const timeDiffSec = (pos.timestamp - lastPosition.timestamp) / 1000;

            // GPS parazitlerini engellemek için minimum 2.5 metre hareket şartı
            if (dMeters >= 2.5 && timeDiffSec > 0) {
              totalMeters += dMeters;

              // Anlık hız (km/s)
              currentSpeedKmh = (dMeters / timeDiffSec) * 3.6;

              // İmkansız hızları sınırla (telefon sapması)
              if (currentSpeedKmh > 25) currentSpeedKmh = 5;

              updateMetricsDisplay();
            } else if (timeDiffSec > 4) {
              // 4 saniyedir hareket yoksa duruyor kabul et
              currentSpeedKmh = 0;
              document.getElementById('speedDisplay').innerText = "0.0";
              document.getElementById('activityState').innerText = "Duruyor";
            }
          }

          lastPosition = { lat, lng, timestamp: pos.timestamp };
        },
        (err) => {
          console.warn("GPS Hatası:", err);
          document.getElementById('statusText').innerText = "Sinyal Yok";
        },
        {
          enableHighAccuracy: true,
          maximumAge: 0,
          timeout: 10000
        }
      );
    }

    function stopTracking() {
      isTracking = false;
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (timerInterval) clearInterval(timerInterval);

      document.getElementById('btnStart').style.display = 'flex';
      document.getElementById('btnStop').style.display = 'none';

      const pill = document.getElementById('statusPill');
      pill.classList.remove('active');
      document.getElementById('statusText').innerText = "Durduruldu";
      document.getElementById('speedDisplay').innerText = "0.0";
      currentSpeedKmh = 0;
    }

    function resetTracking() {
      stopTracking();
      totalMeters = 0;
      totalCalories = 0.0;
      secondsElapsed = 0;
      lastPosition = null;
      currentSpeedKmh = 0;

      document.getElementById('calDisplay').innerText = "0.0";
      document.getElementById('distDisplay').innerText = "0.00";
      document.getElementById('speedDisplay').innerText = "0.0";
      document.getElementById('stepDisplay').innerText = "0";
      document.getElementById('timeDisplay').innerText = "00:00";
      document.getElementById('activityState').innerText = "Hareketsiz Duruyor";
      document.getElementById('statusText').innerText = "Beklemede";
    }

    function updateMetricsDisplay() {
      const km = totalMeters / 1000;
      document.getElementById('distDisplay').innerText = km.toFixed(2);
      document.getElementById('speedDisplay').innerText = currentSpeedKmh.toFixed(1);

      // Ortalama adım boyu (0.75m) üzerinden yaklaşık adım
      const steps = Math.round(totalMeters / 0.75);
      document.getElementById('stepDisplay').innerText = steps;

      // Durum etiketi
      const stateEl = document.getElementById('activityState');
      if (currentSpeedKmh < 1.0) stateEl.innerText = "Duruyor";
      else if (currentSpeedKmh < 5.0) stateEl.innerText = "Yavaş / Normal Yürüyüş";
      else if (currentSpeedKmh < 7.0) stateEl.innerText = "Tempolu Yürüyüş";
      else stateEl.innerText = "Koşu";
    }

    function updateTimerDisplay() {
      const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
      const secs = (secondsElapsed % 60).toString().padStart(2, '0');
      document.getElementById('timeDisplay').innerText = `${mins}:${secs}`;
    }
  </script>
</body>
</html>
