<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Canlı Aktivite & Kalori Takibi</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --brand-orange: #fc6A03;
      --pure-black: #0a0a0a;
      --surface-black: #141414;
      --surface-card: #1c1c1c;
      --pure-white: #ffffff;
      --border-dark: #262626;
      --muted-gray: #888888;
      --green-active: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--pure-black);
      color: var(--pure-white);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-dark);
    }

    .top-bar h1 {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .status-pill {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      background: #222;
      color: var(--muted-gray);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-pill.active {
      background: rgba(0, 230, 118, 0.15);
      color: var(--green-active);
      border: 1px solid var(--green-active);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: currentColor;
    }

    .main-burn {
      background: linear-gradient(145deg, #18120e, var(--surface-black));
      border: 1px solid var(--border-dark);
      border-top: 3px solid var(--brand-orange);
      border-radius: 18px;
      padding: 20px 16px;
      text-align: center;
      margin-bottom: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .burn-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted-gray);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .burn-value {
      font-size: 3.2rem;
      font-weight: 900;
      color: var(--brand-orange);
      line-height: 1.1;
      margin: 6px 0;
      text-shadow: 0 0 20px rgba(252, 106, 3, 0.3);
    }

    .burn-unit {
      font-size: 1rem;
      color: #fff;
      font-weight: 700;
    }

    .speed-tag {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      color: #bbb;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px 12px;
      border-radius: 12px;
    }

    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .metric-card {
      background: var(--surface-black);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 12px;
      text-align: center;
    }

    .metric-icon {
      font-size: 1.1rem;
      color: var(--brand-orange);
      margin-bottom: 4px;
    }

    .metric-val {
      font-size: 1.3rem;
      font-weight: 800;
      color: #fff;
    }

    .metric-lbl {
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--muted-gray);
      text-transform: uppercase;
      margin-top: 2px;
    }

    .settings-bar {
      background: var(--surface-card);
      border: 1px solid var(--border-dark);
      border-radius: 10px;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.8rem;
    }

    .weight-input {
      background: #111;
      border: 1px solid #333;
      color: var(--brand-orange);
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 6px;
      width: 55px;
      text-align: center;
      outline: none;
    }

    /* Canlı Durum ve Debug Paneli */
    .debug-box {
      font-size: 0.72rem;
      color: var(--muted-gray);
      background: #0d0d0d;
      border: 1px dashed #262626;
      border-radius: 8px;
      padding: 8px 10px;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }

    .btn {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.15s ease;
      text-transform: uppercase;
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-start {
      background: var(--brand-orange);
      color: #000;
    }

    .btn-stop {
      background: #d32f2f;
      color: #fff;
      display: none;
    }

    .btn-reset {
      background: #222;
      color: var(--muted-gray);
      flex: 0.35;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>CANLI YÜRÜYÜŞ</h1>
    <div class="status-pill" id="statusPill">
      <span class="status-dot"></span>
      <span id="statusText">Hazır</span>
    </div>
  </div>

  <div class="main-burn">
    <div class="burn-title">Yakılan Aktif Kalori</div>
    <div class="burn-value" id="calDisplay">0.0</div>
    <div class="burn-unit">KCAL</div>
    <div class="speed-tag" id="activityState">Hareketsiz</div>
  </div>

  <div class="metrics-grid">
    <div class="metric-card">
      <i class="fa-solid fa-route metric-icon"></i>
      <div class="metric-val" id="distDisplay">0.00</div>
      <div class="metric-lbl">Mesafe (KM)</div>
    </div>
    <div class="metric-card">
      <i class="fa-solid fa-gauge-high metric-icon"></i>
      <div class="metric-val" id="speedDisplay">0.0</div>
      <div class="metric-lbl">Anlık Hız (KM/S)</div>
    </div>
    <div class="metric-card">
      <i class="fa-solid fa-stopwatch metric-icon"></i>
      <div class="metric-val" id="timeDisplay">00:00</div>
      <div class="metric-lbl">Geçen Süre</div>
    </div>
    <div class="metric-card">
      <i class="fa-solid fa-shoe-prints metric-icon"></i>
      <div class="metric-val" id="stepDisplay">0</div>
      <div class="metric-lbl">Tahmini Adım</div>
    </div>
  </div>

  <div class="settings-bar">
    <span>Kilonuz:</span>
    <div>
      <input type="number" id="weightInput" class="weight-input" value="75">
      <span style="color: var(--muted-gray);">kg</span>
    </div>
  </div>

  <!-- Canlı GPS Bildirim Kutusu -->
  <div class="debug-box" id="debugLog">
    GPS durumu: Henüz başlatılmadı. "Takibi Başlat"a basın.
  </div>

  <div class="controls">
    <button class="btn btn-reset" onclick="resetTracking()"><i class="fa-solid fa-rotate-left"></i></button>
    <button class="btn btn-start" id="btnStart" onclick="startTracking()"><i class="fa-solid fa-play"></i> Başlat</button>
    <button class="btn btn-stop" id="btnStop" onclick="stopTracking()"><i class="fa-solid fa-pause"></i> Durdur</button>
  </div>

  <script>
    let watchId = null;
    let timerInterval = null;
    let isTracking = false;
    let wakeLock = null;

    let startTime = null;
    let accumulatedSeconds = 0;

    let totalMeters = 0;
    let totalCalories = 0.0;
    let lastCoord = null;
    let currentSpeedKmh = 0;

    // Ekranın kapanmasını engelleyen Wake Lock API
    async function requestWakeLock() {
      if ('wakeLock' in navigator) {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch (err) {
          console.warn("WakeLock alınamadı:", err);
        }
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().then(() => wakeLock = null);
      }
    }

    function getDistanceMeters(lat1, lon1, lat2, lon2) {
      const R = 6371e3;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon / 2) * Math.sin(dLon / 2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R * c;
    }

    function getMetBySpeed(speedKmh) {
      if (speedKmh < 1.2) return 0;
      if (speedKmh < 3.8) return 2.8;
      if (speedKmh < 5.5) return 3.8;
      if (speedKmh < 7.0) return 5.0;
      return 8.0;
    }

    function startTracking() {
      if (!navigator.geolocation) {
        alert("Cihazınızda GPS desteği bulunamadı.");
        return;
      }

      isTracking = true;
      startTime = Date.now() - (accumulatedSeconds * 1000);
      requestWakeLock();

      document.getElementById('btnStart').style.display = 'none';
      document.getElementById('btnStop').style.display = 'flex';
      
      const pill = document.getElementById('statusPill');
      pill.classList.add('active');
      document.getElementById('statusText').innerText = "Kayıtta";
      document.getElementById('debugLog').innerText = "GPS uyduları aranıyor... Lütfen açık alanda olun.";

      // Zaman Sayacı (Ekran kapansa bile Date.now() ile doğru süreyi yakalar)
      timerInterval = setInterval(() => {
        const now = Date.now();
        const diffSeconds = Math.floor((now - startTime) / 1000);
        accumulatedSeconds = diffSeconds;

        const mins = Math.floor(diffSeconds / 60).toString().padStart(2, '0');
        const secs = (diffSeconds % 60).toString().padStart(2, '0');
        document.getElementById('timeDisplay').innerText = `${mins}:${secs}`;

        // Kalori ekleme
        const weight = parseFloat(document.getElementById('weightInput').value) || 75;
        const met = getMetBySpeed(currentSpeedKmh);
        if (met > 0) {
          const calPerSec = (met * 3.5 * weight) / (200 * 60);
          totalCalories += calPerSec;
          document.getElementById('calDisplay').innerText = totalCalories.toFixed(1);
        }
      }, 1000);

      // GPS İzleme
      watchId = navigator.geolocation.watchPosition(
        (pos) => {
          const lat = pos.coords.latitude;
          const lng = pos.coords.longitude;
          const accuracy = Math.round(pos.coords.accuracy);

          document.getElementById('debugLog').innerText = `GPS Aktif. Hassasiyet: ±${accuracy}m. Konum alındı.`;

          if (lastCoord) {
            const d = getDistanceMeters(lastCoord.lat, lastCoord.lng, lat, lng);
            const timeDiff = (pos.timestamp - lastCoord.time) / 1000;

            // 1 metreden büyük gerçek adım hareketlerini kabul et
            if (d >= 1.2 && timeDiff > 0) {
              totalMeters += d;

              // Cihazın kendi hesapladığı hız varsa onu kullan, yoksa mesafe/zaman
              if (pos.coords.speed !== null && pos.coords.speed > 0) {
                currentSpeedKmh = pos.coords.speed * 3.6;
              } else {
                currentSpeedKmh = (d / timeDiff) * 3.6;
              }

              if (currentSpeedKmh > 20) currentSpeedKmh = 5.0; // GPS fırlaması koruması
              updateUI();
            }
          }

          lastCoord = { lat, lng, time: pos.timestamp };
        },
        (err) => {
          let msg = "GPS Hatası: ";
          if (err.code === 1) msg += "Konum izni verilmedi.";
          else if (err.code === 2) msg += "Konum bulunamıyor (Uydu yok).";
          else if (err.code === 3) msg += "Zaman aşımı.";
          document.getElementById('debugLog').innerText = msg;
          document.getElementById('statusText').innerText = "Hata";
        },
        {
          enableHighAccuracy: true,
          maximumAge: 1000,
          timeout: 10000
        }
      );
    }

    function stopTracking() {
      isTracking = false;
      if (watchId !== null) navigator.geolocation.clearWatch(watchId);
      if (timerInterval) clearInterval(timerInterval);
      releaseWakeLock();

      document.getElementById('btnStart').style.display = 'flex';
      document.getElementById('btnStop').style.display = 'none';

      const pill = document.getElementById('statusPill');
      pill.classList.remove('active');
      document.getElementById('statusText').innerText = "Durduruldu";
      currentSpeedKmh = 0;
      document.getElementById('speedDisplay').innerText = "0.0";
      document.getElementById('activityState').innerText = "Durduruldu";
      document.getElementById('debugLog').innerText = "Takip durduruldu.";
    }

    function resetTracking() {
      stopTracking();
      totalMeters = 0;
      totalCalories = 0.0;
      accumulatedSeconds = 0;
      startTime = null;
      lastCoord = null;
      currentSpeedKmh = 0;

      document.getElementById('calDisplay').innerText = "0.0";
      document.getElementById('distDisplay').innerText = "0.00";
      document.getElementById('speedDisplay').innerText = "0.0";
      document.getElementById('stepDisplay').innerText = "0";
      document.getElementById('timeDisplay').innerText = "00:00";
      document.getElementById('activityState').innerText = "Hareketsiz";
      document.getElementById('statusText').innerText = "Hazır";
      document.getElementById('debugLog').innerText = "Sayaçlar sıfırlandı.";
    }

    function updateUI() {
      const km = (totalMeters / 1000).toFixed(2);
      document.getElementById('distDisplay').innerText = km;
      document.getElementById('speedDisplay').innerText = currentSpeedKmh.toFixed(1);

      const steps = Math.round(totalMeters / 0.74);
      document.getElementById('stepDisplay').innerText = steps;

      const stateEl = document.getElementById('activityState');
      if (currentSpeedKmh < 1.2) stateEl.innerText = "Hareketsiz";
      else if (currentSpeedKmh < 4.5) stateEl.innerText = "Yavaş Yürüyüş";
      else if (currentSpeedKmh < 6.5) stateEl.innerText = "Tempolu Yürüyüş";
      else stateEl.innerText = "Koşu";
    }
  </script>
</body>
</html>
