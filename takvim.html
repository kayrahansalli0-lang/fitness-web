<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Antrenman Takvimi & Dağılımı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #161616;
      --border-color: #262626;
      --primary-orange: #ff6b00;
      --text-main: #f5f5f5;
      --text-muted: #8a8a8a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
    }

    /* Başlık ve Ay Değiştirici */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .month-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .nav-btn:active {
      border-color: var(--primary-orange);
    }

    /* Takvim Grid */
    .calendar-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 18px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      min-height: 52px;
      background: #111;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .day-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .day-cell.today {
      border-color: var(--primary-orange);
    }

    .day-num {
      font-size: 0.78rem;
      font-weight: 700;
      margin-bottom: 3px;
    }

    .day-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      width: 100%;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Aylık Özet İstatistikleri */
    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .summary-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .summary-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #101010;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .summary-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .summary-val {
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
    }

    /* Modal / Seçim Alanı */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 999;
      justify-content: center;
      align-items: flex-end;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #141414;
      border-top: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      animation: slideUp 0.2s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .muscle-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .muscle-btn {
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .muscle-btn.selected {
      border-color: #fff;
      background: #252525;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .save-btn {
      flex: 1;
      background: var(--primary-orange);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .clear-btn {
      background: #222;
      color: #ff4444;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Başlık -->
  <div class="header">
    <button class="nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="month-title" id="monthDisplay">Eylül 2026</div>
    <button class="nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <!-- Takvim Grid -->
  <div class="calendar-container">
    <div class="weekdays">
      <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <!-- Aylık Toplam Bölge Sayımı -->
  <div class="summary-card">
    <div class="summary-title" id="summaryMonthLabel">Bu Ayın Dağılımı</div>
    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <!-- Seçim Modalı -->
  <div class="modal" id="workoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalDateLabel">Tarih</div>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <div class="muscle-options" id="muscleOptions"></div>

      <div class="modal-actions">
        <button class="clear-btn" onclick="clearDay()">Günü Temizle</button>
        <button class="save-btn" onclick="saveDay()">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    // 8 Bölge ve Belirlenen Renk Paleti
    const MUSCLE_GROUPS = {
      bacak:    { name: "Bacak",    color: "#00E676" }, // Parlak Yeşil
      gogus:    { name: "Göğüs",    color: "#FF3D00" }, // Kırmızı
      omuz:     { name: "Omuz",     color: "#FF9100" }, // Turuncu
      arka_kol: { name: "Arka Kol", color: "#FFD600" }, // Sarı
      on_kol:   { name: "Ön Kol",   color: "#00E5FF" }, // Cyan / Açık Mavi
      bilek:    { name: "Bilek",    color: "#D500F9" }, // Mor / Magenta
      boyun:    { name: "Boyun",    color: "#76FF03" }, // Açık Fıstık Yeşili
      sirt:     { name: "Sırt",     color: "#2979FF" }  // Mavi
    };

    let currentDate = new Date();
    let selectedDateKey = null;
    let tempSelectedMuscles = [];

    // LocalStorage verisi formatı: { "2026-09-12": ["bacak", "gogus"] }
    function getWorkouts() {
      return JSON.parse(localStorage.getItem('fitness_workouts_data') || '{}');
    }

    function saveWorkouts(data) {
      localStorage.setItem('fitness_workouts_data', JSON.stringify(data));
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
      document.getElementById('monthDisplay').textContent = `${monthNames[month]} ${year}`;
      document.getElementById('summaryMonthLabel').textContent = `${monthNames[month]} ${year} Dağılımı`;

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7; // Pazartesi 0
      const totalDays = new Date(year, month + 1, 0).getDate();

      const daysGrid = document.getElementById('daysGrid');
      daysGrid.innerHTML = '';

      const workouts = getWorkouts();
      const today = new Date();

      // Boşluk hücreleri
      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        daysGrid.appendChild(emptyCell);
      }

      // Gün hücreleri
      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        if (isToday) cell.classList.add('today');

        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayWorkouts = workouts[dateKey] || [];

        let dotsHtml = '';
        dayWorkouts.forEach(key => {
          if (MUSCLE_GROUPS[key]) {
            dotsHtml += `<div class="dot" style="background: ${MUSCLE_GROUPS[key].color};"></div>`;
          }
        });

        cell.innerHTML = `
          <span class="day-num">${day}</span>
          <div class="day-dots">${dotsHtml}</div>
        `;

        cell.onclick = () => openModal(dateKey, day, monthNames[month]);
        daysGrid.appendChild(cell);
      }

      renderSummary(year, month, workouts);
    }

    function renderSummary(year, month, workouts) {
      const counts = {};
      Object.keys(MUSCLE_GROUPS).forEach(k => counts[k] = 0);

      const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      for (const [date, list] of Object.entries(workouts)) {
        if (date.startsWith(prefix)) {
          list.forEach(item => {
            if (counts[item] !== undefined) counts[item]++;
          });
        }
      }

      const summaryGrid = document.getElementById('summaryGrid');
      summaryGrid.innerHTML = '';

      Object.entries(MUSCLE_GROUPS).forEach(([key, meta]) => {
        const item = document.createElement('div');
        item.className = 'summary-item';
        item.innerHTML = `
          <div class="summary-label">
            <span class="dot" style="background: ${meta.color}; width: 8px; height: 8px;"></span>
            <span>${meta.name}</span>
          </div>
          <div class="summary-val">${counts[key]} <span style="font-size: 0.65rem; color: var(--text-muted);">GÜN</span></div>
        `;
        summaryGrid.appendChild(item);
      });
    }

    function openModal(dateKey, day, monthName) {
      selectedDateKey = dateKey;
      const workouts = getWorkouts();
      tempSelectedMuscles = [...(workouts[dateKey] || [])];

      document.getElementById('modalDateLabel').textContent = `${day} ${monthName} İdmanı`;
      const optionsContainer = document.getElementById('muscleOptions');
      optionsContainer.innerHTML = '';

      Object.entries(MUSCLE_GROUPS).forEach(([key, meta]) => {
        const btn = document.createElement('button');
        btn.className = `muscle-btn ${tempSelectedMuscles.includes(key) ? 'selected' : ''}`;
        btn.innerHTML = `
          <span class="dot" style="background: ${meta.color}; width: 8px; height: 8px;"></span>
          <span>${meta.name}</span>
        `;
        btn.onclick = () => {
          if (tempSelectedMuscles.includes(key)) {
            tempSelectedMuscles = tempSelectedMuscles.filter(m => m !== key);
            btn.classList.remove('selected');
          } else {
            tempSelectedMuscles.push(key);
            btn.classList.add('selected');
          }
        };
        optionsContainer.appendChild(btn);
      });

      document.getElementById('workoutModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('workoutModal').classList.remove('active');
    }

    function saveDay() {
      if (!selectedDateKey) return;
      const workouts = getWorkouts();

      if (tempSelectedMuscles.length > 0) {
        workouts[selectedDateKey] = tempSelectedMuscles;
      } else {
        delete workouts[selectedDateKey];
      }

      saveWorkouts(workouts);
      closeModal();
      renderCalendar();
    }

    function clearDay() {
      if (!selectedDateKey) return;
      const workouts = getWorkouts();
      delete workouts[selectedDateKey];
      saveWorkouts(workouts);
      closeModal();
      renderCalendar();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>
