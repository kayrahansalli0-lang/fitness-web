<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Antrenman Takvimi & Dağılımı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #161616;
      --border-color: #262626;
      --primary-orange: #ff6b00;
      --gold-pr: #ffd700;
      --text-main: #f5f5f5;
      --text-muted: #8a8a8a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .month-title {
      font-size: 1.1rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      color: #fff;
    }

    .nav-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color 0.2s;
    }

    .nav-btn:active {
      border-color: var(--primary-orange);
    }

    .calendar-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px;
      margin-bottom: 18px;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .day-cell {
      min-height: 56px;
      background: #111;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      position: relative;
      transition: all 0.15s ease;
    }

    .day-cell.empty {
      background: transparent;
      border-color: transparent;
      cursor: default;
    }

    .day-cell.today {
      border-color: var(--primary-orange);
    }

    /* Rekor / PR Günü Vurgusu */
    .day-cell.is-pr {
      background: linear-gradient(180deg, rgba(255, 215, 0, 0.15) 0%, #151510 100%);
      border-color: var(--gold-pr) !important;
      box-shadow: inset 0 0 10px rgba(255, 215, 0, 0.2), 0 0 8px rgba(255, 215, 0, 0.15);
    }

    .day-header {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
      margin-bottom: 3px;
    }

    .day-num {
      font-size: 0.78rem;
      font-weight: 700;
    }

    .day-badges {
      display: flex;
      gap: 3px;
      font-size: 0.6rem;
    }

    .badge-icon-pr {
      color: var(--gold-pr);
    }

    .badge-icon-note {
      color: var(--text-muted);
    }

    .day-dots {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 3px;
      width: 100%;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    /* Genel Özet İstatistikleri (3'lü Sayaç Izgarası) */
    .overview-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .overview-box {
      background: #111;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px 6px;
      text-align: center;
    }

    .overview-box .num {
      font-size: 1.3rem;
      font-weight: 900;
      color: var(--primary-orange);
    }

    .overview-box .num.gold {
      color: var(--gold-pr);
      text-shadow: 0 0 8px rgba(255, 215, 0, 0.3);
    }

    .overview-box .label {
      font-size: 0.65rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-top: 3px;
    }

    .summary-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .summary-title {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .summary-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #101010;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .summary-label {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .summary-val {
      font-size: 0.85rem;
      font-weight: 800;
      color: #fff;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      z-index: 999;
      justify-content: center;
      align-items: flex-end;
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      background: #141414;
      border-top: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
      border-radius: 20px 20px 0 0;
      padding: 20px;
      animation: slideUp 0.2s ease-out;
      max-height: 90vh;
      overflow-y: auto;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 800;
    }

    .close-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
    }

    .pr-toggle-box {
      margin-bottom: 14px;
    }

    .pr-btn {
      width: 100%;
      background: #1e1b10;
      border: 1px dashed #554400;
      color: #e5c158;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .pr-btn.active {
      background: #ffd700;
      color: #000;
      border-style: solid;
      border-color: #ffd700;
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.4);
    }

    .muscle-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    .muscle-btn {
      background: #1c1c1c;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 9px 11px;
      border-radius: 10px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .muscle-btn.selected {
      border-color: #fff;
      background: #252525;
    }

    .note-section {
      margin-bottom: 16px;
    }

    .note-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .note-textarea {
      width: 100%;
      height: 70px;
      background: #101010;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      color: #fff;
      font-size: 0.82rem;
      resize: none;
      outline: none;
    }

    .note-textarea:focus {
      border-color: var(--primary-orange);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .save-btn {
      flex: 1;
      background: var(--primary-orange);
      color: #000;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .clear-btn {
      background: #222;
      color: #ff4444;
      border: 1px solid #333;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <button class="nav-btn" onclick="changeMonth(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <div class="month-title" id="monthDisplay">Eylül 2026</div>
    <button class="nav-btn" onclick="changeMonth(1)"><i class="fa-solid fa-chevron-right"></i></button>
  </div>

  <div class="calendar-container">
    <div class="weekdays">
      <div>Pzt</div><div>Sal</div><div>Çar</div><div>Per</div><div>Cum</div><div>Cmt</div><div>Paz</div>
    </div>
    <div class="days-grid" id="daysGrid"></div>
  </div>

  <div class="summary-card">
    <div class="summary-title" id="summaryMonthLabel">Bu Ayın Özeti</div>
    
    <!-- 3'lü Genel Sayaç -->
    <div class="overview-row">
      <div class="overview-box">
        <div class="num" id="totalWorkoutDays">0</div>
        <div class="label">İdman</div>
      </div>
      <div class="overview-box">
        <div class="num" id="totalRestDays" style="color: #78909C;">0</div>
        <div class="label">Dinlenme</div>
      </div>
      <div class="overview-box">
        <div class="num gold" id="totalPrDays">0</div>
        <div class="label">Rekor (PR)</div>
      </div>
    </div>

    <div class="summary-grid" id="summaryGrid"></div>
  </div>

  <!-- Modal -->
  <div class="modal" id="workoutModal">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title" id="modalDateLabel">Tarih</div>
        <button class="close-btn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- PR / Rekor Günü Butonu -->
      <div class="pr-toggle-box">
        <button class="pr-btn" id="prBtn" onclick="togglePr()">
          <i class="fa-solid fa-trophy"></i>
          <span>Bu Gün Rekor / PR Günü!</span>
        </button>
      </div>

      <!-- Kas Grupları -->
      <div class="muscle-options" id="muscleOptions"></div>

      <!-- Özel Not Alanı -->
      <div class="note-section">
        <div class="note-label"><i class="fa-solid fa-pen"></i> Günün Notu & Ağırlıklar</div>
        <textarea class="note-textarea" id="noteInput" placeholder="Örn: Bench 100kg 1RM denendi, squat 4x8 90kg..."></textarea>
      </div>

      <div class="modal-actions">
        <button class="clear-btn" onclick="clearDay()">Günü Temizle</button>
        <button class="save-btn" onclick="saveDay()">Kaydet</button>
      </div>
    </div>
  </div>

  <script>
    const MUSCLE_GROUPS = {
      gogus:    { name: "Göğüs",      color: "#FF3D00", type: "workout" },
      sirt:     { name: "Sırt",       color: "#2979FF", type: "workout" },
      omuz:     { name: "Omuz",       color: "#FF9100", type: "workout" },
      arka_kol: { name: "Arka Kol",   color: "#FFD600", type: "workout" },
      on_kol:   { name: "Ön Kol",     color: "#00E5FF", type: "workout" },
      bacak:    { name: "Bacak",      color: "#00E676", type: "workout" },
      karin:    { name: "Karın",      color: "#FF1493", type: "workout" },
      bilek:    { name: "Bilek",      color: "#D500F9", type: "workout" },
      boyun:    { name: "Boyun",      color: "#76FF03", type: "workout" },
      kardiyo:  { name: "Kardiyo",    color: "#E040FB", type: "workout" },
      rest:     { name: "Dinlenme",   color: "#78909C", type: "rest" }
    };

    let currentDate = new Date();
    let selectedDateKey = null;
    let tempSelectedMuscles = [];
    let tempIsPr = false;

    function getWorkouts() {
      const raw = JSON.parse(localStorage.getItem('fitness_workouts_data') || '{}');
      const normalized = {};
      for (const [date, val] of Object.entries(raw)) {
        if (Array.isArray(val)) {
          normalized[date] = { muscles: val, note: "", isPr: false };
        } else {
          normalized[date] = val;
        }
      }
      return normalized;
    }

    function saveWorkouts(data) {
      localStorage.setItem('fitness_workouts_data', JSON.stringify(data));
    }

    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
      document.getElementById('monthDisplay').textContent = `${monthNames[month]} ${year}`;
      document.getElementById('summaryMonthLabel').textContent = `${monthNames[month]} ${year} Özeti`;

      const firstDayIndex = (new Date(year, month, 1).getDay() + 6) % 7;
      const totalDays = new Date(year, month + 1, 0).getDate();

      const daysGrid = document.getElementById('daysGrid');
      daysGrid.innerHTML = '';

      const workouts = getWorkouts();
      const today = new Date();

      for (let i = 0; i < firstDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.className = 'day-cell empty';
        daysGrid.appendChild(emptyCell);
      }

      for (let day = 1; day <= totalDays; day++) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';

        const isToday = today.getFullYear() === year && today.getMonth() === month && today.getDate() === day;
        if (isToday) cell.classList.add('today');

        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const dayData = workouts[dateKey] || { muscles: [], note: "", isPr: false };

        if (dayData.isPr) {
          cell.classList.add('is-pr');
        }

        let dotsHtml = '';
        dayData.muscles.forEach(key => {
          if (MUSCLE_GROUPS[key]) {
            dotsHtml += `<div class="dot" style="background: ${MUSCLE_GROUPS[key].color};"></div>`;
          }
        });

        let badgesHtml = '';
        if (dayData.isPr) {
          badgesHtml += `<i class="fa-solid fa-trophy badge-icon-pr" title="Rekor Günü"></i>`;
        }
        if (dayData.note && dayData.note.trim() !== '') {
          badgesHtml += `<i class="fa-solid fa-note-sticky badge-icon-note" title="Not Var"></i>`;
        }

        cell.innerHTML = `
          <div class="day-header">
            <span class="day-num">${day}</span>
            <div class="day-badges">${badgesHtml}</div>
          </div>
          <div class="day-dots">${dotsHtml}</div>
        `;

        cell.onclick = () => openModal(dateKey, day, monthNames[month]);
        daysGrid.appendChild(cell);
      }

      renderSummary(year, month, workouts);
    }

    function renderSummary(year, month, workouts) {
      const counts = {};
      Object.keys(MUSCLE_GROUPS).forEach(k => counts[k] = 0);

      let totalWorkoutDaysCount = 0;
      let totalRestDaysCount = 0;
      let totalPrDaysCount = 0;

      const prefix = `${year}-${String(month + 1).padStart(2, '0')}`;
      for (const [date, data] of Object.entries(workouts)) {
        if (date.startsWith(prefix)) {
          if (data.isPr) totalPrDaysCount++;

          if (data.muscles && data.muscles.length > 0) {
            const hasWorkout = data.muscles.some(item => MUSCLE_GROUPS[item] && MUSCLE_GROUPS[item].type === 'workout');
            const hasRest = data.muscles.includes('rest');

            if (hasWorkout) totalWorkoutDaysCount++;
            if (hasRest) totalRestDaysCount++;

            data.muscles.forEach(item => {
              if (counts[item] !== undefined) counts[item]++;
            });
          }
        }
      }

      document.getElementById('totalWorkoutDays').textContent = totalWorkoutDaysCount;
      document.getElementById('totalRestDays').textContent = totalRestDaysCount;
      document.getElementById('totalPrDays').textContent = totalPrDaysCount;

      const summaryGrid = document.getElementById('summaryGrid');
      summaryGrid.innerHTML = '';

      Object.entries(MUSCLE_GROUPS).forEach(([key, meta]) => {
        const item = document.createElement('div');
        item.className = 'summary-item';
        item.innerHTML = `
          <div class="summary-label">
            <span class="dot" style="background: ${meta.color}; width: 8px; height: 8px;"></span>
            <span>${meta.name}</span>
          </div>
          <div class="summary-val">${counts[key]} <span style="font-size: 0.65rem; color: var(--text-muted);">GÜN</span></div>
        `;
        summaryGrid.appendChild(item);
      });
    }

    function renderModalButtons() {
      const optionsContainer = document.getElementById('muscleOptions');
      optionsContainer.innerHTML = '';

      Object.entries(MUSCLE_GROUPS).forEach(([key, meta]) => {
        const btn = document.createElement('button');
        btn.className = `muscle-btn ${tempSelectedMuscles.includes(key) ? 'selected' : ''}`;
        btn.innerHTML = `
          <span class="dot" style="background: ${meta.color}; width: 8px; height: 8px;"></span>
          <span>${meta.name}</span>
        `;
        btn.onclick = () => {
          if (key === 'rest') {
            if (tempSelectedMuscles.includes('rest')) {
              tempSelectedMuscles = [];
            } else {
              tempSelectedMuscles = ['rest'];
            }
          } else {
            tempSelectedMuscles = tempSelectedMuscles.filter(m => m !== 'rest');
            if (tempSelectedMuscles.includes(key)) {
              tempSelectedMuscles = tempSelectedMuscles.filter(m => m !== key);
            } else {
              tempSelectedMuscles.push(key);
            }
          }
          renderModalButtons();
        };
        optionsContainer.appendChild(btn);
      });

      const prBtn = document.getElementById('prBtn');
      if (tempIsPr) {
        prBtn.classList.add('active');
        prBtn.innerHTML = `<i class="fa-solid fa-trophy"></i> <span>🔥 REKOR / PR GÜNÜ AKTİF</span>`;
      } else {
        prBtn.classList.remove('active');
        prBtn.innerHTML = `<i class="fa-solid fa-trophy"></i> <span>Bu Gün Rekor / PR Günü!</span>`;
      }
    }

    function togglePr() {
      tempIsPr = !tempIsPr;
      renderModalButtons();
    }

    function openModal(dateKey, day, monthName) {
      selectedDateKey = dateKey;
      const workouts = getWorkouts();
      const dayData = workouts[dateKey] || { muscles: [], note: "", isPr: false };

      tempSelectedMuscles = [...dayData.muscles];
      tempIsPr = !!dayData.isPr;

      document.getElementById('modalDateLabel').textContent = `${day} ${monthName} Kaydı`;
      document.getElementById('noteInput').value = dayData.note || "";

      renderModalButtons();
      document.getElementById('workoutModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('workoutModal').classList.remove('active');
    }

    function saveDay() {
      if (!selectedDateKey) return;
      const workouts = getWorkouts();
      const noteVal = document.getElementById('noteInput').value.trim();

      if (tempSelectedMuscles.length > 0 || noteVal !== '' || tempIsPr) {
        workouts[selectedDateKey] = {
          muscles: tempSelectedMuscles,
          note: noteVal,
          isPr: tempIsPr
        };
      } else {
        delete workouts[selectedDateKey];
      }

      saveWorkouts(workouts);
      closeModal();
      renderCalendar();
    }

    function clearDay() {
      if (!selectedDateKey) return;
      const workouts = getWorkouts();
      delete workouts[selectedDateKey];
      saveWorkouts(workouts);
      closeModal();
      renderCalendar();
    }

    function changeMonth(delta) {
      currentDate.setMonth(currentDate.getMonth() + delta);
      renderCalendar();
    }

    renderCalendar();
  </script>
</body>
</html>
