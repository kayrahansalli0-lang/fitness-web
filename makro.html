<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Makro & Bütçe Dostu Beslenme Asistanı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --primary-orange: #ff6b00;
      --accent-orange: #ff8800;
      --bg-main: #0a0a0a;
      --bg-card: #141414;
      --border-color: #262626;
      --text-main: #f5f5f5;
      --text-muted: #8a8a8a;
      --green-budget: #00e676;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      padding-bottom: 40px;
    }

    .header-box {
      margin-bottom: 18px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }

    .header-box h1 {
      font-size: 1.2rem;
      font-weight: 800;
    }

    .header-box h1 span { color: var(--primary-orange); }
    .header-box p { font-size: 0.75rem; color: var(--text-muted); margin-top: 2px; }

    .calc-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    label {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      background: #0d0d0d;
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--primary-orange);
    }

    /* Hedef Seçici */
    .goal-selector {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin: 10px 0 14px 0;
    }

    .goal-btn {
      background: #0d0d0d;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px 4px;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .goal-btn.active {
      background: rgba(255, 107, 0, 0.15);
      border-color: var(--primary-orange);
      color: var(--primary-orange);
    }

    /* Bütçe / Menü Tipi Seçici */
    .budget-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .budget-btn {
      background: #0d0d0d;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .budget-btn.active {
      background: rgba(0, 230, 118, 0.12);
      border-color: var(--green-budget);
      color: var(--green-budget);
    }

    .btn-calc {
      width: 100%;
      background: var(--primary-orange);
      color: #000;
      border: none;
      padding: 13px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Sonuçlar */
    .results-section {
      display: none;
      animation: fadeIn 0.3s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .total-cal-box {
      background: linear-gradient(135deg, #1f140e, var(--bg-card));
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary-orange);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-bottom: 12px;
    }

    .total-cal-val {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--primary-orange);
    }

    .macros-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }

    .macro-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 10px;
      text-align: center;
    }

    .macro-val {
      font-size: 1.2rem;
      font-weight: 800;
      color: #fff;
    }

    .macro-lbl {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Öğün Listesi */
    .meals-container {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 16px;
    }

    .meals-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .meals-title {
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--primary-orange);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .badge-budget {
      background: rgba(0, 230, 118, 0.15);
      color: var(--green-budget);
      border: 1px solid var(--green-budget);
      font-size: 0.68rem;
      padding: 3px 8px;
      border-radius: 6px;
      font-weight: 800;
    }

    .meal-item {
      background: #0d0d0d;
      border: 1px solid #1f1f1f;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
    }

    .meal-name {
      font-size: 0.78rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .meal-desc {
      font-size: 0.74rem;
      color: #ccc;
      line-height: 1.45;
    }

    .pro-tip {
      font-size: 0.7rem;
      color: var(--primary-orange);
      margin-top: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="header-box">
    <h1>MAKRO & BESLENME <span>SİHİRBAZI</span></h1>
    <p>Bütçene ve hedefine göre net kalori, protein ve market menüsü.</p>
  </div>

  <div class="calc-card">
    <div class="grid-2">
      <div>
        <label>Cinsiyet</label>
        <select id="gender">
          <option value="male">Erkek</option>
          <option value="female">Kadın</option>
        </select>
      </div>
      <div>
        <label>Yaş</label>
        <input type="number" id="age" value="22">
      </div>
    </div>

    <div class="grid-2">
      <div>
        <label>Boy (cm)</label>
        <input type="number" id="height" value="178">
      </div>
      <div>
        <label>Kilo (kg)</label>
        <input type="number" id="weight" value="75">
      </div>
    </div>

    <label>Haftalık Aktivite Seviyesi</label>
    <select id="activity" style="margin-bottom: 12px;">
      <option value="1.2">Masa Başı / Hareketsiz</option>
      <option value="1.375">Hafif Hareketli (Haftada 1-2 gün spor)</option>
      <option value="1.55" selected>Orta Hareketli (Haftada 3-5 gün ağırlık)</option>
      <option value="1.725">Çok Aktif (Haftada 6-7 gün ağır idman)</option>
    </select>

    <label>Hedefin Nedir?</label>
    <div class="goal-selector">
      <div class="goal-btn active" data-goal="cut" onclick="setGoal('cut', this)">
        <i class="fa-solid fa-fire"></i><br>Definasyon
      </div>
      <div class="goal-btn" data-goal="maintain" onclick="setGoal('maintain', this)">
        <i class="fa-solid fa-scale-balanced"></i><br>Koruma
      </div>
      <div class="goal-btn" data-goal="bulk" onclick="setGoal('bulk', this)">
        <i class="fa-solid fa-dumbbell"></i><br>Clean Bulk
      </div>
    </div>

    <!-- Menü Bütçe Tercihi -->
    <label>Menü Stratejisi</label>
    <div class="budget-selector">
      <div class="budget-btn active" data-budget="student" onclick="setBudget('student', this)">
        <i class="fa-solid fa-wallet"></i> Bütçe Dostu (Öğrenci)
      </div>
      <div class="budget-btn" data-budget="standard" onclick="setBudget('standard', this)">
        <i class="fa-solid fa-drumstick-bite"></i> Standart Menü
      </div>
    </div>

    <button class="btn-calc" onclick="calculatePlan()">
      <i class="fa-solid fa-wand-magic-sparkles"></i> Planı & Öğünleri Çıkar
    </button>
  </div>

  <!-- Sonuç Alanı -->
  <div class="results-section" id="resultsSection">
    
    <div class="total-cal-box">
  <div style="font-size: 0.72rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase;">Günlük Hedef Kalorin</div>
  <div class="total-cal-val" id="resCalories">0</div>
  <div style="font-size: 0.75rem; color: #fff; font-weight: 600; margin-bottom: 10px;" id="resGoalText">Definasyon Kalorisi</div>
  
  <button onclick="saveTargetToDashboard()" id="btnSaveTarget" style="background: rgba(255, 107, 0, 0.15); border: 1px solid var(--primary-orange); color: var(--primary-orange); padding: 8px 16px; border-radius: 8px; font-size: 0.75rem; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;">
    <i class="fa-solid fa-bookmark"></i> Ana Sayfa Hedefine Eşitle
  </button>
</div>

    <div class="macros-grid">
      <div class="macro-box">
        <div class="macro-val" id="resProtein" style="color: #00E676;">0g</div>
        <div class="macro-lbl">Protein</div>
      </div>
      <div class="macro-box">
        <div class="macro-val" id="resCarbs" style="color: #00E5FF;">0g</div>
        <div class="macro-lbl">Karbonhidrat</div>
      </div>
      <div class="macro-box">
        <div class="macro-val" id="resFats" style="color: #FFD600;">0g</div>
        <div class="macro-lbl">Sağlıklı Yağ</div>
      </div>
    </div>

    <!-- Dinamik Menü -->
    <div class="meals-container">
      <div class="meals-header">
        <div class="meals-title">
          <i class="fa-solid fa-utensils"></i> Günlük Beslenme Planı
        </div>
        <div id="budgetBadge" class="badge-budget">Bütçe Dostu</div>
      </div>
      <div id="mealsList"></div>
    </div>

  </div>

  <script>
    let currentGoal = 'cut';
    let currentBudget = 'student';

    function setGoal(goal, element) {
      currentGoal = goal;
      document.querySelectorAll('.goal-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    function setBudget(budget, element) {
      currentBudget = budget;
      document.querySelectorAll('.budget-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');
    }

    function calculatePlan() {
      const gender = document.getElementById('gender').value;
      const age = parseFloat(document.getElementById('age').value) || 22;
      const height = parseFloat(document.getElementById('height').value) || 178;
      const weight = parseFloat(document.getElementById('weight').value) || 75;
      const activity = parseFloat(document.getElementById('activity').value) || 1.55;

      // 1. Mifflin-St Jeor Formülü ile BMR
      let bmr = (10 * weight) + (6.25 * height) - (5 * age);
      bmr = (gender === 'male') ? bmr + 5 : bmr - 161;

      // 2. Günlük Toplam Harcama (TDEE)
      const tdee = bmr * activity;

      // 3. Hedefe Göre Makrolar
      let targetCalories = 0;
      let proteinGrams = 0;
      let fatGrams = 0;
      let carbGrams = 0;
      let goalText = "";

      if (currentGoal === 'cut') {
        targetCalories = Math.round(tdee - 450);
        proteinGrams = Math.round(weight * 2.2);
        fatGrams = Math.round(weight * 0.8);
        goalText = "Definasyon (Yağ Yakımı)";
      } else if (currentGoal === 'bulk') {
        targetCalories = Math.round(tdee + 350);
        proteinGrams = Math.round(weight * 2.0);
        fatGrams = Math.round(weight * 0.9);
        goalText = "Clean Bulk (Kas Kazanımı)";
      } else {
        targetCalories = Math.round(tdee);
        proteinGrams = Math.round(weight * 2.0);
        fatGrams = Math.round(weight * 0.85);
        goalText = "Kilo Koruma & Recomp";
      }

      // Kalan kalorileri karbonhidrata çevir
      const usedCalories = (proteinGrams * 4) + (fatGrams * 9);
      carbGrams = Math.max(0, Math.round((targetCalories - usedCalories) / 4));

      // UI Güncelle
      document.getElementById('resCalories').innerText = targetCalories;
      document.getElementById('resProtein').innerText = proteinGrams + "g";
      document.getElementById('resCarbs').innerText = carbGrams + "g";
      document.getElementById('resFats').innerText = fatGrams + "g";
      document.getElementById('resGoalText').innerText = goalText;

      const badge = document.getElementById('budgetBadge');
      if (currentBudget === 'student') {
        badge.innerText = "Öğrenci / Bütçe Dostu";
        badge.style.display = "block";
      } else {
        badge.innerText = "Standart Menü";
        badge.style.borderColor = "var(--border-color)";
        badge.style.color = "#aaa";
        badge.style.background = "#222";
      }

      renderMeals(currentGoal, currentBudget);
      document.getElementById('resultsSection').style.display = 'block';
    }

    function renderMeals(goal, budget) {
      const listEl = document.getElementById('mealsList');
      listEl.innerHTML = '';
      let meals = [];

      if (budget === 'student') {
        // --- BÜTÇE DOSTU / ÖĞRENCİ MENÜSÜ ---
        if (goal === 'cut') {
          meals = [
            {
              name: "1. Öğün: Yumurta & Lor Bombası (Kahvaltı)",
              desc: "4 adet haşlanmış yumurta (2 sarısı çıkarılabilir), 100g böreklik/tatlı lor peyniri, 50g yulaf ezmesi (suyla veya çayla lapa), bol maydanoz & salatalık.",
              tip: "💡 İpucu: Lor peynirinin 100 gramında yaklaşık 17-19g saf protein bulunur, fiyat/protein oranı en yüksek besindir."
            },
            {
              name: "2. Öğün: Yeşil Mercimek & Bulgur Gücü (Öğle / İdman Öncesi)",
              desc: "1 büyük tabak haşlanmış yeşil mercimek yemeği (yaklaşık 100g kuru ağırlık), 4-5 yemek kaşığı pilavlık bulgur, 1 kase yoğurt.",
              tip: "💡 İpucu: Mercimek + bulgur birlikte tüketildiğinde eksik aminoasitler birbirini tamamlar ve tam protein profili oluşturur."
            },
            {
              name: "3. Öğün: Tavuk Ciğeri veya Tavuk Göğsü (Akşam)",
              desc: "200g tavuk ciğeri veya tavuk göğsü (tavuk ciğeri yarı yarıya daha ucuzdur ve B12/demir zenginidir), bol soğanlı mevsim salatası, 1 tatlı kaşığı zeytinyağı veya ayçiçek.",
              tip: "💡 Alternatif: Ciğer sevmiyorsan marketten dondurulmuş veya bütün tavuk alıp göğsünü haşlayabilirsin."
            },
            {
              name: "4. Kapanış: Kazein Etkili Lor & Fıstık (Gece)",
              desc: "100g lor peyniri (içine biraz tarçın atıp karıştırabilirsin), 1 avuç kavrulmamış yer fıstığı (20g).",
              tip: "💡 Yer fıstığı badem ve cevize kıyasla 3 kat daha ucuzdur ve sağlıklı yağ ihtiyacını karşılar."
            }
          ];
        } else if (goal === 'bulk') {
          meals = [
            {
              name: "1. Öğün: Kalori Canavarı Yulaf Lapası",
              desc: "4 tam yumurta (omlet), 90g yulaf ezmesi + 1 adet muz + 2 tatlı kaşığı yer fıstığı ezmesi + 1 tatlı kaşığı bal/pekmez.",
              tip: "💡 Karbonhidrat ve sağlıklı yağ ile sabah depolarını fulle."
            },
            {
              name: "2. Öğün: Kuru Fasulye / Nohut & Pirinç (Öğle)",
              desc: "1.5 porsiyon zeytinyağlı kuru fasulye veya nohut, tepeleme 1 tabak pirinç pilavı veya makarna (250g pişmiş), 1 büyük kase tam yağlı yoğurt.",
              tip: "💡 Kuru baklagiller ucuz hacim (bulk) döneminin en sağlam yakıtıdır."
            },
            {
              name: "3. Öğün: Tavuk & Makarna Yüklemesi (Akşam)",
              desc: "200g tavuk göğsü veya tavuk kıyması, 250g haşlanmış makarna (üzerine 50g lor peyniri serpiştirilmiş), mevsim salatası.",
              tip: "💡 Tavuk kıymasından soslu makarna yaparak yemesi çok daha kolay bir bulk öğünü elde edersin."
            },
            {
              name: "4. Gece: Yüksek Proteinli Shake",
              desc: "1 bardak süt, 100g lor peyniri, 1 adet muz, 1 kaşık fıstık ezmesi (blender'dan geçir).",
              tip: "💡 Çiğnemeden 30g proteini 2 dakikada mideye indirmenin en ekonomik yolu."
            }
          ];
        } else {
          meals = [
            {
              name: "1. Öğün: Ekonomik Dengeli Kahvaltı",
              desc: "3 tam yumurta, 75g lor peyniri, 60g yulaf ezmesi, domates & yeşillik, 1 dilim ekmek."
            },
            {
              name: "2. Öğün: Bakliyat & Karbonhidrat Dengesi",
              desc: "1 tabak yeşil mercimek veya nohut yemeği, 1 tabak bulgur pilavı, 1 kase yoğurt."
            },
            {
              name: "3. Öğün: Proteinli Akşam Yemeği",
              desc: "180g tavuk göğsü veya tavuk ciğeri, haşlanmış patates veya makarna, mevsim yeşillikleri."
            }
          ];
        }
      } else {
        // --- STANDART MENÜ (Tavuk, Kırmızı Et, Balık) ---
        if (goal === 'cut') {
          meals = [
            {
              name: "1. Öğün: Tok Tutan Yüksek Protein Kahvaltı",
              desc: "3 tam yumurta + 2 yumurta beyazı (omlet), 50g yulaf ezmesi, bol yeşillik ve salatalık, 5-6 adet zeytin."
            },
            {
              name: "2. Öğün: İdman Öncesi Enerji",
              desc: "180g ızgara tavuk göğsü veya hindi, 150g basmati pirinç veya karabuğday, haşlanmış brokoli."
            },
            {
              name: "3. Öğün: Akşam Toparlanması",
              desc: "180g yağsız dana bonfile / antrikot veya ızgara balık, büyük boy mevsim salatası, 1 tatlı kaşığı sızma zeytinyağı."
            },
            {
              name: "4. Gece: Süzme Yoğurt & Badem",
              desc: "150g yağsız süzme yoğurt, 15-20g çiğ badem."
            }
          ];
        } else if (goal === 'bulk') {
          meals = [
            {
              name: "1. Öğün: Güçlü Başlangıç",
              desc: "4 tam yumurta, 90g yulaf ezmesi, 1 muz, 30g fındık/ceviz, 1 dilim tam buğday ekmeği."
            },
            {
              name: "2. Öğün: İdman Öncesi Hacim",
              desc: "200g ızgara tavuk göğsü, 250g basmati pirinç veya makarna, 1 kase yoğurt."
            },
            {
              name: "3. Öğün: Kırmızı Et & Karbonhidrat",
              desc: "200g ızgara dana köfte veya biftek, 250g fırın patates, zeytinyağlı salata."
            },
            {
              name: "4. Gece: Kapanış",
              desc: "200g süzme peynir, 1 yeşil elma, 20g ceviz içi."
            }
          ];
        } else {
          meals = [
            {
              name: "1. Öğün: Dengeli Kahvaltı",
              desc: "3 tam yumurta, 60g yulaf, 1 dilim beyaz peynir, yeşillikler."
            },
            {
              name: "2. Öğün: Öğle Enerjisi",
              desc: "180g hindi veya tavuk göğsü, 200g pirinç/bulgur, 1 kase yoğurt."
            },
            {
              name: "3. Öğün: Akşam",
              desc: "180g ızgara somon veya dana eti, fırınlanmış sebzeler ve mevsim salatası."
            }
          ];
        }
      }

      meals.forEach(m => {
        const div = document.createElement('div');
        div.className = 'meal-item';
        div.innerHTML = `
          <div class="meal-name">
            <span>${m.name}</span>
          </div>
          <div class="meal-desc">${m.desc}</div>
          ${m.tip ? `<div class="pro-tip">${m.tip}</div>` : ''}
        `;
        listEl.appendChild(div);
      });
    }
  </script>
</body>
</html>
