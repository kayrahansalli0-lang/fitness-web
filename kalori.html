<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/png" href="Gemini_Generated_Image_bjczfnbjczfnbjcz (1).jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Akıllı Kalori Tarayıcı</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #161616;
      --border-color: #262626;
      --primary-orange: #ff6b00;
      --accent-orange: #ff8800;
      --text-main: #f5f5f5;
      --text-muted: #8a8a8a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      padding: 16px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    .header-box {
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-box h2 {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .header-box h2 span {
      color: var(--primary-orange);
    }

    .camera-wrapper {
      position: relative;
      width: 100%;
      height: 320px;
      background: #111;
      border: 2px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    #cameraFeed, #snapshotPreview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #snapshotPreview {
      display: none;
    }

    .scan-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      border: 2px dashed rgba(255, 107, 0, 0.6);
      border-radius: 16px;
      pointer-events: none;
      display: none;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .btn {
      padding: 13px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.85rem;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .btn-orange {
      background: var(--primary-orange);
      color: #000;
    }

    .btn-orange:hover {
      background: var(--accent-orange);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-main);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .result-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary-orange);
      border-radius: 14px;
      padding: 16px;
      display: none;
    }

    .result-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .calories-badge {
      color: var(--accent-orange);
      font-size: 1.25rem;
      font-weight: 900;
    }

    .macros-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #242424;
      text-align: center;
    }

    .macro-item span {
      display: block;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 3px;
    }

    .macro-item strong {
      font-size: 0.95rem;
      color: #fff;
    }

    .loading-state {
      display: none;
      text-align: center;
      padding: 15px;
      color: var(--primary-orange);
      font-weight: 700;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header-box">
      <h2>AKILLI <span>KALORİ</span> TARAYICI</h2>
      <i class="fa-solid fa-apple-whole" style="color: var(--primary-orange); font-size: 1.2rem;"></i>
    </div>

    <div class="camera-wrapper">
      <video id="cameraFeed" autoplay playsinline muted></video>
      <img id="snapshotPreview" alt="Önizleme">
      <div class="scan-overlay" id="scanOverlay"></div>
    </div>

    <div class="controls-grid">
      <button class="btn btn-outline" id="cameraToggleBtn" onclick="toggleCamera()">
        <i class="fa-solid fa-camera"></i> Kamerayı Aç
      </button>
      <button class="btn btn-orange" id="analyzeBtn" onclick="scanFood()" disabled>
        <i class="fa-solid fa-bolt"></i> Kalori Hesapla
      </button>
    </div>

    <canvas id="captureCanvas" style="display: none;"></canvas>

    <div class="loading-state" id="loadingState">
      <i class="fa-solid fa-spinner fa-spin"></i> Yiyecek taranıyor, lütfen bekleyin...
    </div>

    <div class="result-card" id="resultCard">
      <div class="result-title">
        <span id="foodName">Yiyecek Adı</span>
        <span class="calories-badge" id="foodCalories">0 kcal</span>
      </div>
      <p id="foodDescription" style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;"></p>

      <div class="macros-grid">
        <div class="macro-item">
          <span>Protein</span>
          <strong id="foodProtein">-</strong>
        </div>
        <div class="macro-item">
          <span>Karbonhidrat</span>
          <strong id="foodCarbs">-</strong>
        </div>
        <div class="macro-item">
          <span>Yağ</span>
          <strong id="foodFat">-</strong>
        </div>
      </div>
    </div>
  </div>

  <script>
    // Canlı Render backend endpoint adresi
    const BACKEND_URL = "https://fitness-backend-opv7.onrender.com/api/analyze-food";

    let videoStream = null;
    const video = document.getElementById('cameraFeed');
    const snapshotPreview = document.getElementById('snapshotPreview');
    const scanOverlay = document.getElementById('scanOverlay');
    const canvas = document.getElementById('captureCanvas');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const cameraToggleBtn = document.getElementById('cameraToggleBtn');
    const loadingState = document.getElementById('loadingState');
    const resultCard = document.getElementById('resultCard');

    async function toggleCamera() {
      if (videoStream) {
        stopCamera();
        cameraToggleBtn.innerHTML = '<i class="fa-solid fa-camera"></i> Kamerayı Aç';
        analyzeBtn.disabled = true;
        scanOverlay.style.display = 'none';
      } else {
        try {
          let constraints = { video: { facingMode: 'environment' }, audio: false };

          try {
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
          } catch (e) {
            videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          }

          video.srcObject = videoStream;
          await video.play();

          video.style.display = 'block';
          snapshotPreview.style.display = 'none';
          scanOverlay.style.display = 'block';
          cameraToggleBtn.innerHTML = '<i class="fa-solid fa-stop"></i> Kamerayı Kapat';
          analyzeBtn.disabled = false;
        } catch (err) {
          alert("Kamera Hatası: " + err.name + " - " + err.message);
          console.error("Kamera hatası:", err);
        }
      }
    }

    function stopCamera() {
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
    }

    async function scanFood() {
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const fullDataUrl = canvas.toDataURL('image/jpeg', 0.5);
      const base64Image = fullDataUrl.split(',')[1];

      snapshotPreview.src = fullDataUrl;
      video.style.display = 'none';
      snapshotPreview.style.display = 'block';
      scanOverlay.style.display = 'none';

      loadingState.style.display = 'block';
      resultCard.style.display = 'none';
      analyzeBtn.disabled = true;

      try {
        const response = await fetch(BACKEND_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            imageBase64: base64Image
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `Sunucu Hatası: ${response.status}`);
        }

        document.getElementById('foodName').textContent = data.foodName || "Yiyecek Algılanamadı";
        document.getElementById('foodCalories').textContent = `${data.calories || 0} kcal`;
        document.getElementById('foodProtein').textContent = data.protein || "-";
        document.getElementById('foodCarbs').textContent = data.carbs || "-";
        document.getElementById('foodFat').textContent = data.fat || "-";
        document.getElementById('foodDescription').textContent = data.notes || "";

        resultCard.style.display = 'block';
      } catch (err) {
        alert("İşlem tamamlanamadı: " + err.message);
        console.error("Hata ayrıntısı:", err);
      } finally {
        loadingState.style.display = 'none';
        analyzeBtn.disabled = false;
      }
    }
  </script>

</body>
</html>
