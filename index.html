<!DOCTYPE html>
<html lang="tr">
<head>
  <link rel="icon" type="image/png" href="Gemini_Generated_Image_bjczfnbjczfnbjcz (1).jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Fitness PR</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0a0a0a;
      --bg-card: #161616;
      --bg-card-hover: #1f1f1f;
      --border-color: #262626;
      --primary-orange: #ff6b00;
      --accent-orange: #ff8800;
      --text-main: #f5f5f5;
      --text-muted: #8a8a8a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ANA İÇERİK ALANI */
    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      padding-bottom: calc(90px + env(safe-area-inset-bottom));
    }

    .tab-content {
      display: none;
      height: 100%;
    }

    .tab-content.active {
      display: block;
    }

    /* --- 1. ÖN SAYFA (DASHBOARD) --- */
    .home-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 20px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-avatar {
      width: 52px;
      height: 52px;
      min-width: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary-orange);
      box-shadow: 0 0 12px rgba(255, 107, 0, 0.35);
      background: #222;
    }

    .header-text h1 {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 0.3px;
    }

    .header-text h1 span {
      color: var(--primary-orange);
    }

    .header-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Motivasyon Kartı */
    .quote-card {
      background: linear-gradient(135deg, #1c140e, #141414);
      border: 1px solid var(--border-color);
      border-left: 4px solid var(--primary-orange);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
    }

    .quote-badge {
      font-size: 0.75rem;
      color: var(--primary-orange);
      font-weight: 800;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .quote-text {
      font-size: 0.95rem;
      font-style: italic;
      color: #e5e5e5;
      line-height: 1.4;
    }

    /* İstatistikler Izgarası */
    .quick-stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 18px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: 0.2s ease;
    }

    .stat-card:hover {
      border-color: rgba(255, 107, 0, 0.4);
    }

    .stat-card i {
      font-size: 1.4rem;
      color: var(--primary-orange);
    }

    .stat-val {
      font-size: 1.25rem;
      font-weight: 800;
      color: #fff;
    }

    .stat-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    /* Ön Sayfadaki Gömülü Çerçeve */
    .home-custom-frame {
      width: 100%;
      height: 380px;
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      background-color: var(--bg-card);
    }

    .home-custom-frame iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* --- SU TAKİBİ SAYFASI --- */
    .water-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-top: 30px;
      gap: 20px;
    }

    .water-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 30px 20px;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .water-icon {
      font-size: 50px;
      color: var(--primary-orange);
      filter: drop-shadow(0 0 10px rgba(255, 107, 0, 0.4));
    }

    .water-amount {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--accent-orange);
    }

    .water-target {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .water-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .water-btn {
      background-color: #111;
      border: 1px solid var(--primary-orange);
      color: var(--primary-orange);
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .water-btn:active {
      transform: scale(0.96);
    }

    .water-btn:hover {
      background-color: var(--primary-orange);
      color: #000;
    }

    .reset-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-decoration: underline;
    }

    /* --- SABİT ALT MENÜ (BOTTOM NAV) --- */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #121212;
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding-top: 10px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.7);
      border-top: 1px solid var(--border-color);
      z-index: 1000;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      text-decoration: none;
      cursor: pointer;
      flex: 1;
      transition: all 0.2s ease-in-out;
      user-select: none;
    }

    .nav-item i {
      font-size: 18px;
      margin-bottom: 4px;
      transition: transform 0.2s ease;
    }

    .nav-item span {
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 0.2px;
    }

    .nav-item.active {
      color: var(--primary-orange);
    }

    .nav-item.active i {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  
  <main class="content-area">
    
    <div id="home-page" class="tab-content active">
      <div class="home-header">
        <img src="Gemini_Generated_Image_bjczfnbjczfnbjcz (1).jpg" onerror="this.src='https://via.placeholder.com/52/161616/ff6b00?text=FIT'" alt="Profil" class="header-avatar" />
        <div class="header-text">
          <h1>Hoş Geldin, <span>Sporcu</span> 🔥</h1>
          <p>Disiplin bugün de devrede.</p>
        </div>
      </div>

      <div class="quote-card">
        <div class="quote-badge">
          <i class="fa-solid fa-bolt"></i> <span id="quoteDay">GÜNÜN MOTİVASYONU</span>
        </div>
        <p class="quote-text" id="dailyQuote">Yükleniyor...</p>
      </div>

      <div class="quick-stats-grid">
        <div class="stat-card">
          <i class="fa-solid fa-fire"></i>
          <span class="stat-val">0 kcal</span>
          <span class="stat-label">Yakılan Kalori</span>
        </div>
        <div class="stat-card">
          <i class="fa-solid fa-droplet"></i>
          <span class="stat-val" id="homeWaterDisplay">0 ml</span>
          <span class="stat-label">Su Tüketimi</span>
        </div>
      </div>

      <div class="home-custom-frame">
        <iframe src="music.html"></iframe>
      </div>
    </div>
    
    <div id="adim-page" class="tab-content" style="padding: 0;">
      <iframe src="adim.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <div id="music-page" class="tab-content" style="padding: 0;">
      <iframe src="music.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <div id="kalori-page" class="tab-content" style="padding: 0;">
      <iframe src="kalori.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <div id="antrenman-page" class="tab-content" style="padding: 0;">
      <iframe src="antrenman.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <div id="dinlenme-page" class="tab-content" style="padding: 0;">
      <iframe src="dinlenme.html" style="width: 100%; height: 100%; border: none;"></iframe>
    </div>

    <div id="su-page" class="tab-content">
      <div class="water-container">
        <div class="water-card">
          <i class="fa-solid fa-droplet water-icon"></i>
          <div>
            <div class="water-amount" id="waterDisplay">0 ml</div>
            <div class="water-target">Hedef: 3000 ml</div>
          </div>

          <div class="water-controls">
            <button class="water-btn" onclick="addWater(200)">
              <i class="fa-solid fa-glass-water"></i> +200 ml
            </button>
            <button class="water-btn" onclick="addWater(500)">
              <i class="fa-solid fa-bottle-water"></i> +500 ml
            </button>
          </div>

          <button class="reset-btn" onclick="resetWater()">Sayacı Sıfırla</button>
        </div>
      </div>
    </div>

  </main>

  <nav class="bottom-nav">
    <div class="nav-item active" data-target="home-page">
      <i class="fa-solid fa-house"></i>
      <span>Ön Sayfa</span>
    </div>

    <div class="nav-item" data-target="adim-page">
      <i class="fa-solid fa-person-walking"></i>
      <span>Adım</span>
    </div>

    <div class="nav-item" data-target="music-page">
      <i class="fa-solid fa-music"></i>
      <span>Playlist</span>
    </div>

    <div class="nav-item" data-target="kalori-page">
      <i class="fa-solid fa-fire"></i>
      <span>Kalori</span>
    </div>
    
    <div class="nav-item" data-target="antrenman-page">
      <i class="fa-solid fa-dumbbell"></i>
      <span>Antrenman</span>
    </div>

    <div class="nav-item" data-target="dinlenme-page">
      <i class="fa-solid fa-stopwatch"></i>
      <span>Dinlenme</span>
    </div>
    
    <div class="nav-item" data-target="su-page">
      <i class="fa-solid fa-droplet"></i>
      <span>Su</span>
    </div>
  </nav>

  <script>
    // Sekme Geçiş Mantığı
    const navItems = document.querySelectorAll('.nav-item');
    const tabContents = document.querySelectorAll('.tab-content');

    function switchToTab(pageId) {
      navItems.forEach(nav => {
        nav.classList.toggle('active', nav.getAttribute('data-target') === pageId);
      });

      tabContents.forEach(content => {
        content.classList.toggle('active', content.id === pageId);
      });
    }

    navItems.forEach(item => {
      item.addEventListener('click', function() {
        const targetPageId = this.getAttribute('data-target');
        switchToTab(targetPageId);
      });
    });

    // 30 Günlük Motivasyon Havuzu
    const quotes = [
      "Disiplin, canın istemediğinde bile yapman gerekeni yapmaktır.",
      "Ağrı geçicidir, pes etmek ise sonsuza kadar sürer.",
      "Bugün gösterdiğin çaba, yarınki gücünü belirler.",
      "Hedefine giden yolda en büyük rakibin aynadaki kişidir.",
      "Son tekrarlar, değişimin başladığı yerdir. Bırakma!",
      "Yetenek seni başlatır, alışkanlık ve disiplin devam ettirir.",
      "Bugün yapacağın fedakarlıklar, yarınki zaferinin temelleridir.",
      "Bahaneler kalori yakmaz. Harekete geç!",
      "Zorluklar, sınırlarını aşman için karşına çıkar.",
      "Dinlenmek haktır ama vazgeçmek asla seçenek değildir.",
      "Ter akıtmadığın hiçbir zafer kalıcı olmaz.",
      "Başlamak için mükemmel olmak zorunda değilsin ama mükemmel olmak için başlamalısın.",
      "Vücudun pes etmek istediğinde zihnine odaklan.",
      "Bugünkü antrenman, gelecekteki haline verdiğin bir sözdür.",
      "Küçük adımlar, büyük hedeflere giden en sağlam yoldur.",
      "Sadece salonda değil, zihninde de ağırlık kaldırmayı öğrenmelisin.",
      "Dünün yorgunluğu, bugünün gücüdür.",
      "Sonuca değil, sürece ve disiplinine aşık ol.",
      "Başkalarının ne yaptığına değil, kendi sınırlarına odaklan.",
      "Her antrenman, kendine olan saygını yeniden inşa eder.",
      "Zirveye giden yol her zaman dik ve yorucudur.",
      "Kolay olsaydı herkes yapardı. Farkını ortaya koy!",
      "Kendine inanmadığın an, antrenmanın bittiği andır.",
      "Yarın keşke başlasaydım dememek için bugün başla.",
      "Sabır ve disiplin, kasın en güçlü yapı taşıdır.",
      "Gelişim, konfor alanının bittiği yerde başlar.",
      "Yorulduğunda durma, işin bittiğinde dur.",
      "Günün şartları ne olursa olsun standardını koru.",
      "Pes etmeyi düşündüğünde neden başladığını hatırla.",
      "Şampiyonlar ışıklar altında değil, kimse bakmıyorken verdikleri emekle doğar."
    ];

    function setDailyQuote() {
      const today = new Date();
      const dayIndex = today.getDate() % quotes.length;
      document.getElementById('quoteDay').textContent = `${today.getDate()}. GÜNÜN MOTİVASYONU`;
      document.getElementById('dailyQuote').textContent = `"${quotes[dayIndex]}"`;
    }

    // Su Takibi (Gece Sıfırlaması & LocalStorage)
    function checkAndResetWater() {
      const todayStr = new Date().toDateString();
      const savedDate = localStorage.getItem('water_tracker_date');

      if (savedDate !== todayStr) {
        localStorage.setItem('water_tracker_date', todayStr);
        localStorage.setItem('water_tracker_amount', '0');
      }
      updateWaterUI();
    }

    function addWater(amount) {
      checkAndResetWater();
      let currentWater = parseInt(localStorage.getItem('water_tracker_amount') || '0', 10);
      currentWater += amount;
      localStorage.setItem('water_tracker_amount', currentWater.toString());
      updateWaterUI();
    }

    function resetWater() {
      localStorage.setItem('water_tracker_amount', '0');
      updateWaterUI();
    }

    function updateWaterUI() {
      const amount = localStorage.getItem('water_tracker_amount') || '0';
      document.getElementById('waterDisplay').textContent = `${amount} ml`;
      document.getElementById('homeWaterDisplay').textContent = `${amount} ml`;
    }

    setDailyQuote();
    checkAndResetWater();
    setInterval(checkAndResetWater, 60000);
  </script>
</body>
</html>
